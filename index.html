<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ห้องเรียนครูแม็ค — แพลตฟอร์มการเรียนรู้ด้านเทคโนโลยีและการเขียนโปรแกรม แบบ Interactive ที่ทันสมัยและเข้าใจง่าย" />
    <!-- Preconnect to Google Fonts (non-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load font with display=swap — prevents render blocking, shows fallback first -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
    <title>ห้องเรียนครูแม็ค | Mack's Classroom</title>
    <!-- Inline critical CSS for instant loading skeleton -->
    <style>
      .root-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#f8fafc,#fff,rgba(238,242,255,.3));z-index:9999;font-family:system-ui,-apple-system,sans-serif}
      .root-loader-logo{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem}
      .root-loader-icon{width:3rem;height:3rem;background:linear-gradient(135deg,#4f46e5,#9333ea);border-radius:.75rem;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(99,102,241,.3);animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
      .root-loader-text{font-weight:800;font-size:1.25rem;background:linear-gradient(to right,#4338ca,#9333ea);-webkit-background-clip:text;background-clip:text;color:transparent}
      .root-loader-spinner{width:2.5rem;height:2.5rem;position:relative;margin-bottom:1rem}
      .root-loader-spinner::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid #e0e7ff}
      .root-loader-spinner::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#4f46e5;animation:spin 1s linear infinite}
      .root-loader-msg{font-size:.875rem;color:#94a3b8;font-weight:500}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
    </style>
  </head>
  <body>
    <!-- Inline loading skeleton — visible instantly before React hydrates -->
    <div id="root">
      <div class="root-loader">
        <div class="root-loader-logo">
          <div class="root-loader-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/></svg>
          </div>
          <span class="root-loader-text">ห้องเรียนครูแม็ค</span>
        </div>
        <div class="root-loader-spinner"></div>
        <p class="root-loader-msg">กำลังโหลด...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
